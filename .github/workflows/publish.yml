name: Release

# Push a tag vX.Y.Z (matching package.json) to publish that version to npm.
# npm authenticates this workflow through its Trusted Publisher (OIDC) setting
# for @sniffski/squire, so no token or 2FA prompt is involved.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing, provenance and the MCP Registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup submodules sparse-checkout
        run: |
          chmod +x scripts/setup-submodules-sparse.sh
          ./scripts/setup-submodules-sparse.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json is $v"; exit 1; }
      - run: npm install
      - run: npm run build
      # The web tests drive a real Chromium. --with-deps runs apt, and the
      # Ubuntu mirrors intermittently fail DNS on hosted runners; retry so a
      # mirror blip does not fail a release.
      - name: Install Chromium for the web tests
        run: |
          for attempt in 1 2 3 4; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or newer. Upgrade only now:
      # npm 11 lays out the Appium packages differently and their types
      # then clash, so install and build with Node 22's own npm.
      - run: npm install -g npm@latest
      - run: npm publish --access public --ignore-scripts
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the MCP Registry
        continue-on-error: true
        run: |
          # npm processing delays have run to ~14 minutes; allow 30.
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 180); do npm view "@sniffski/squire@$v" version >/dev/null 2>&1 && break; sleep 10; done
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
