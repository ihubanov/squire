name: Code Quality and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format-and-test:
    name: ESLint, Prettier, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Node 22 with its own npm: npm 11 (Node 24) lays out the Appium
      # packages so that their types clash and the build fails.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: SocketDev/action@v1
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - run: npm run build
        name: Build

      # The web tests drive a real Chromium.
      - run: npx playwright install --with-deps chromium

      - name: Run Unit Tests
        run: npm run test
