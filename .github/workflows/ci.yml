name: Code Quality and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow pushes the post-publish pin commit with the
  # repository token, which does not trigger `push`; dispatch this workflow
  # after a release to verify main explicitly.
  workflow_dispatch:

jobs:
  lint-format-and-test:
    name: ESLint, Prettier, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Node 22 with its own npm: npm 11 (Node 24) lays out the Appium
      # packages so that their types clash and the build fails.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The plugin launches its MCP server through plugin/bin/squire-mcp.mjs
      # at `@sniffski/squire@<pinned>`, so a release that forgets to bump the
      # pin ships the old server to every plugin user. The check also proves
      # the launcher (which repairs a corrupt npx cache) is wired up.
      - name: Verify release pins
        run: node scripts/verify-pins.mjs

      # A pin that is not on npm yet makes every plugin install a dead MCP.
      # verify-pins.mjs cannot know the registry, so check it here. The
      # Release workflow only moves main after this resolves, which leaves
      # this guard to catch a hand-pushed pre-release version bump. Release
      # branches legitimately carry the bump before publish, so restrict the
      # check to main.
      - name: Pinned server version must be published
        if: github.ref == 'refs/heads/main'
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if npm view "@sniffski/squire@$v" version >/dev/null 2>&1; then
              echo "@sniffski/squire@$v is published"
              exit 0
            fi
            sleep 10
          done
          echo "::error::main pins @sniffski/squire@$v, which is not on npm; never push a release bump before its tag publishes"
          exit 1

      - uses: SocketDev/action@v1
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - run: npm run build
        name: Build

      # The web tests drive a real Chromium. --with-deps runs apt, and the
      # Ubuntu mirrors intermittently fail DNS on hosted runners; retry so a
      # mirror blip does not red the whole run.
      - name: Install Chromium for the web tests
        run: |
          for attempt in 1 2 3 4; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Unit Tests
        run: npm run test
