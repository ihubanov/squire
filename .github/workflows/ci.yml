name: Code Quality and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format-and-test:
    name: ESLint, Prettier, and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Node 22 with its own npm: npm 11 (Node 24) lays out the Appium
      # packages so that their types clash and the build fails.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: SocketDev/action@v1
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - run: npm run build
        name: Build

      # The web tests drive a real Chromium. --with-deps runs apt, and the
      # Ubuntu mirrors intermittently fail DNS on hosted runners; retry so a
      # mirror blip does not red the whole run.
      - name: Install Chromium for the web tests
        run: |
          for attempt in 1 2 3 4; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Unit Tests
        run: npm run test
