name: Prettier debug

# Temporary: prints the canonical Prettier formatting for one file so the
# local tree can match it without running a formatter on the developer box.
# Deleted before the PR is proposed for merge.
on:
  pull_request:
    branches: [main]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Show Prettier's change
        run: |
          npx --yes prettier@3.9.10 --write src/stale-reaper.ts
          git --no-pager diff -- src/stale-reaper.ts
